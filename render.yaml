services:
  - type: web
    name: lostlink
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    dockerfilePath: Dockerfile
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: APP_NAME
        value: LostLink
      - key: DATABASE_URL
        fromDatabase:
          name: lostlink-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: lostlink-images
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: onboarding@resend.dev
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: lostlink-postgres
    plan: free
    region: oregon
    databaseName: lostlink
    user: lostlink_user

