name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite (Python 3.11 & PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lostlink
          POSTGRES_PASSWORD: lostlink_password
          POSTGRES_DB: lostlink
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest-cov

      - name: Run Alembic migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg2://lostlink:lostlink_password@localhost:5432/lostlink
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest test suite
        env:
          DATABASE_URL: postgresql+psycopg2://lostlink:lostlink_password@localhost:5432/lostlink
          SECRET_KEY: ci_secret_key_for_testing_lostlink_min_32_bytes_long
          STORAGE_PROVIDER: local
          EMAIL_PROVIDER: console
        run: |
          cd backend
          python -m pytest -v

  frontend-check:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: |
          cd frontend
          npm ci

      - name: Typecheck and Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Verify build artifacts
        run: |
          test -f frontend/dist/index.html
          test -f frontend/dist/manifest.webmanifest

